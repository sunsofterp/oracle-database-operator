---
# Mirror declaration for this fork's controller image. The Release asset (an
# OCI image-layout tarball, multi-arch, built by .github/workflows/release.yml)
# is copied into THIS cluster's OCIR compartment digest-preserving; the target
# is an env-generic placeholder the iak ApplicationSet patches per environment
# (…/oracle-database-operator-<environment>:<tag>).
#
# sourceDigest is the image's OCI MANIFEST-LIST digest from the release body
# ("## Controller image") — the scan/policy subject identity today
# (refuse-on-mismatch is an open provenance-lifecycle work item); the
# load-bearing content-address check is the digest pin the consuming XCluster
# platform item carries (saas-tenant-cluster/cluster/xcluster.yaml).
#
# WRAPPED IN AN OptionalManifests CARRIER (iak ADR-075): the MirroredArtifact
# CRD arrives with the provenance-lifecycle app at runtime, and a raw manifest
# with an unserved GVK poisons the whole Application's atomic sync. The
# carrier applies clean immediately; the operator materializes the inner
# manifest once the CRD is served.
apiVersion: resources.sunsofterp.com/v1
kind: OptionalManifests
metadata:
  name: oracle-database-operator-image
  namespace: oracle-database-operator-system
spec:
  manifests:
    - apiVersion: mirror.sunsofterp.com/v1alpha1
      kind: MirroredArtifact
      metadata:
        name: oracle-database-operator-image
        namespace: oracle-database-operator-system
      spec:
        type: oci
        # v2.2.0-sunsofterp.3 = sunsofterp.2 + DbcsSystem launch network
        # passthrough (#7: nsgIds/backupNetworkNsgIds fields; privateIp,
        # timeZone, faultDomains, backupSubnetId now reach LaunchDbSystem) —
        # what XOracleSystem needs to pin a Base DB node in the data network
        # behind the proxy-only NSG. Prior sunsofterp.2 digest sha256:918535c2….
        # Prior v2.2.0-sunsofterp.2 = sunsofterp.1 + AutonomousDatabase cross-region
        # disaster recovery (#4: DR-peer create, peerDbId on Switchover/Failover,
        # DR status) + the cluster-scoped ClusterRoleBinding in platform/base (#5).
        # Prior v2.2.0-sunsofterp.1 = upstream v2.2.0 + spec.details.databaseEdition
        # (#1) + the estate release/platform tree (#2); digest sha256:538db1d1….
        source: github-release://sunsofterp/oracle-database-operator@v2.2.0-sunsofterp.3/oracle-database-operator-v2.2.0-sunsofterp.3.oci.tar
        sourceDigest: sha256:e450f0acffb122c0da8c3ce39eee8e4f57ea664d3166ab6d02286003f96fc58e
        target: iad.ocir.io/idfkrwsy40sd/oracle-database-operator/oracle-database-operator:env-generic-placeholder
        interval: 10m
